[build-system]
requires = ["setuptools>=77.0", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phoenix-quantum"
dynamic = ["version"]
description = "PHOENIX: Pauli-based High-level Optimization ENgine for Instruction eXecution on NISQ Devices"
readme = "README.md"
requires-python = ">=3.8,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "Zhaohui Yang", email = "youngcius007@gmail.com"},
]
maintainers = [
    {name = "Zhaohui Yang", email = "youngcius007@gmail.com"},
]
keywords = [
    "quantum computing",
    "quantum compiler",
    "VQA",
    "Pauli strings",
    "Clifford",
    "Hamiltonian simulation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development :: Compilers",
    "Typing :: Typed",
]
dependencies = [
    "qiskit>=1.0.0",
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "joblib>=1.1.0",
    "prettytable>=3.0.0",
    "rustworkx",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.5.0"]
tket = ["pytket"]
dev = [
    "build>=1.0",
    "twine>=5.0",
    "ruff>=0.4",
    "black>=24.0",
]
all = ["matplotlib>=3.5.0", "pytket"]

[project.urls]
Homepage = "https://github.com/iqubit-org/phoenix"
Documentation = "https://github.com/iqubit-org/phoenix/blob/master/README.md"
Repository = "https://github.com/iqubit-org/phoenix"
"Bug Tracker" = "https://github.com/iqubit-org/phoenix/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["phoenix*"]

[tool.setuptools.package-data]
phoenix = ["py.typed"]

[tool.setuptools_scm]
# Version is derived from the nearest git tag (e.g. `v0.1.0` → `0.1.0`).
# Untagged dev builds produce `0.1.1.dev<n>+g<sha>[.dYYYYMMDD]` (PEP 440).
# When building from an sdist (no .git), falls back to the static version below.
fallback_version = "0.1.0"
# Write the resolved version into `phoenix/_version.py` at build time so it
# survives editable installs and bundled sdists.
version_file = "phoenix/_version.py"

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | obsolete\.phoenix
  | obsolete\.phoenix\.2
  | phoenixV2
  | paulihedral
  | tetris
  | artifact_dac25
)/
'''

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "obsolete\\.phoenix",
    "obsolete\\.phoenix\\.2",
    "phoenixV2",
    "paulihedral",
    "tetris",
    "artifact_dac25",
]

[tool.ruff]
line-length = 120
target-version = "py38"
exclude = [
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".tox",
    ".venv",
    "build",
    "dist",
    "obsolete.phoenix",
    "obsolete.phoenix.2",
    "phoenixV2",
    "paulihedral",
    "tetris",
    "artifact_dac25",
]

[tool.ruff.lint]
# Relaxed ruleset: focus on rules that catch real bugs; drop purely cosmetic
# or style-preference categories that don't fit scientific-code conventions
# (uppercase math symbols, whitespace noise, subjective simplifications).
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes (undefined names, unused imports, etc.)
    "I",      # isort (auto-fixable)
    "UP",     # pyupgrade (modernize syntax)
    "B",      # flake8-bugbear (real bug patterns)
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E402",   # module-level import not at top (common in notebooks/scripts)
    "E741",   # ambiguous variable names (l, I, O) — natural in math code
    "B008",   # function call in default arg (common in Qiskit-style APIs)
    "B905",   # zip without strict= (py3.9 compat)
    "C901",   # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__.py

[tool.ruff.lint.isort]
known-first-party = ["phoenix"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
